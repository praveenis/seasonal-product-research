name: Static site preflight

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check local links and deployment files
        run: python tools/check_static_site.py
